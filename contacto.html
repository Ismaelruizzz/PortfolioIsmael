<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contacto — Ismael Ruiz García</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#121316;
    --surface:#1b1d22;
    --line:#2b2e35;
    --text:#ece9e2;
    --text-dim:#8b8d95;
    --accent:#c9a24b;
    --radius:10px;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }

  a{color:inherit;}

  .scrubber{
    position:sticky;
    top:0;
    z-index:10;
    background:rgba(18,19,22,.9);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }

  .track{
    max-width:1080px;
    margin:0 auto;
    padding:0 24px;
    display:flex;
    align-items:center;
    gap:28px;
    overflow-x:auto;
    scrollbar-width:none;
  }

  .track::-webkit-scrollbar{display:none;}

  .track a{
    padding:18px 0;
    font-size:13px;
    white-space:nowrap;
    color:var(--text-dim);
    text-decoration:none;
    font-family:'Space Grotesk';
    font-weight:500;
    transition:color .15s;
  }

  .track a:hover{color:var(--text);}
  .track a.active{color:var(--accent);}

  main{
    max-width:680px;
    margin:0 auto;
    padding:80px 24px;
  }

  .contact{
    text-align:center;
  }

  .contact-photo{
    width:150px;
    height:150px;
    object-fit:cover;
    border-radius:50%;
    display:block;
    margin:0 auto 32px;
    border:3px solid var(--accent);
  }

  .eyebrow{
    font-family:'IBM Plex Mono',ui-monospace,monospace;
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--accent);
    margin-bottom:14px;
  }

  h1{
    font-family:'Space Grotesk',system-ui,sans-serif;
    font-size:clamp(36px,6vw,52px);
    margin:0 0 40px;
    letter-spacing:-.01em;
    font-weight:600;
  }

  .contact-info{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:28px;
    text-align:left;
  }

  .contact-item{
    padding:18px 0;
    border-bottom:1px solid var(--line);
  }

  .contact-item:first-child{padding-top:0;}
  .contact-item:last-child{
    padding-bottom:0;
    border-bottom:none;
  }

  .label{
    display:block;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--text-dim);
    margin-bottom:5px;
  }

  .value{
    font-size:16px;
    color:var(--text);
  }

  .back{
    display:inline-block;
    margin-top:32px;
    color:var(--accent);
    text-decoration:none;
    font-family:'IBM Plex Mono',ui-monospace,monospace;
    font-size:12px;
  }

  .back:hover{text-decoration:underline;}
</style>
</head>
<body>

<nav class="scrubber">
  <div class="track">
    <a href="index.html">Portfolio</a>
    <a href="contacto.html" class="active">Contacto</a>
  </div>
</nav>

<main>
  <div class="contact">
    <img class="contact-photo" src="foto.jpeg" alt="Foto de Ismael Ruiz García">

    <div class="eyebrow">Contacto</div>

    <div class="contact-info">
      <div class="contact-item">
        <span class="value">Ismael Ruiz García</span>
      </div>


      <div class="contact-item">
        <span class="value">Teléfono: 657 31 28 03</span>
      </div>

      <div class="contact-item">
        <span class="value">ismaelrugarcia@gmail.com</span> 
      </div>
    </div>

    <a class="back" href="index.html">← Volver a Inicio</a>
  </div>
</main>

</body>
</html>
